<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- styles -->
  <link rel="stylesheet" href="../assets/css/aos.css">
  <link rel="stylesheet" href="../assets/css/slick.css">
  <link rel="stylesheet" href="../assets/css/slick-theme.css">
  <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/style.css" />
  <!-- styles -->
  <title>Reward</title>
</head>

<body>
  <div class="" style="height: 400px; display: block; width: 100%;"></div>
  <!-- body content start -->
  <section class="pre-rwd__main">
    <div class="content-wrapper">
      <div class="pre-rwd">
        <div class="pre-rwd__header">

          <div class="pre-rwd__heading">
            <h2 class="pre-rwd__title">
              THE CHAMPIONS'<br>
              REWARD
            </h2>
          </div>

          <div class="pre-rwd__description">
            <p class="pre-rwd__text">
              Recognizing the top talent in the industry with substantial cash prizes
              and professional endorsement.
            </p>
          </div>

        </div>

        <div class="pre-rwd__cards">

          <div class="pre-rwd__card">
            <div class="pre-rwd__content">
              <span class="pre-rwd__label">GOLD MEDALIST</span>
              <h3 class="pre-rwd__price">RM 2,000</h3>
            </div>

            <div class="pre-rwd__image" data-aos="fade-down">
              <img src="../assets/images/gold-medal.png" alt="Gold Medal">
            </div>
          </div>

          <div class="pre-rwd__card">
            <div class="pre-rwd__content">
              <span class="pre-rwd__label">SILVER MEDALIST</span>
              <h3 class="pre-rwd__price">RM 1,200</h3>
            </div>

            <div class="pre-rwd__image" data-aos="fade-down">
              <img src="../assets/images/silver-medal.png" alt="Silver Medal">
            </div>
          </div>

          <div class="pre-rwd__card">
            <div class="pre-rwd__content">
              <span class="pre-rwd__label">BRONZE MEDALIST</span>
              <h3 class="pre-rwd__price">RM 800</h3>
            </div>

            <div class="pre-rwd__image" data-aos="fade-down">
              <img src="../assets/images/bronze-medal.png" alt="Bronze Medal">
            </div>
          </div>

        </div>
      </div>
    </div>

  </section>
  <div class="" style="height: 400px; display: block; width: 100%;"></div>
  <!-- body content end -->

  <!-- scripts -->
  <script src="../assets/js/jquery.slim.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="../assets/js/slick.min.js"></script>
  <script src="../assets/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/script.js"></script>
  <!-- scripts -->
  <script>
			AOS.init({
				duration: 1000
			});
		</script>
</body>

</html>
