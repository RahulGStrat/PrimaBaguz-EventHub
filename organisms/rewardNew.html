<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- styles -->
  <link rel="stylesheet" href="../assets/css/aos.css">
  <link rel="stylesheet" href="../assets/css/slick.css">
  <link rel="stylesheet" href="../assets/css/slick-theme.css">
  <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/style.css" />
  <!-- styles -->
  <title>Reward</title>
</head>

<body>
  <div class="" style="height: 400px; display: block; width: 100%;"></div>
  <!-- body content start -->
  <section class="pre-rwds__main">
    <div class="content-wrapper">
      <div class="pre-rwds">
        <div class="pre-rwds__header">

          <div class="pre-rwds__heading">
            <h2 class="pre-rwds__title">
              THE CHAMPIONS'<br>
              REWARD
            </h2>
          </div>

          <div class="pre-rwds__description">
            <p class="pre-rwds__text">
              Recognizing the top talent in the industry with substantial cash prizes
              and professional endorsement.
            </p>
          </div>

        </div>

        <div class="pre-rwds__cards">

          <div class="pre-rwds__card">
            <div class="pre-rwds__content">
              <span class="pre-rwds__label">Class M41</span>
               <div class="pre-rwds__amount">
                <span class="pre-rwds__currency">RM</span>
                <span class="pre-rwds__value">2,000</span>
                <span class="pre-rwds__money">
                  <img src="../assets/images/money-icn.png">
                </span>
              </div>
              <div class="pre-rwds__footer">Trophy, Medals & Certificates</div>
            </div>

            <div class="pre-rwds__image">
              <img src="../assets/images/trophy-img.png" alt="">
            </div>
          </div>

          <div class="pre-rwds__card">
            <div class="pre-rwds__content">
              <span class="pre-rwds__label">Class M50</span>
              <div class="pre-rwds__amount">
                <span class="pre-rwds__currency">RM</span>
                <span class="pre-rwds__value">800</span>
                <span class="pre-rwds__money">
                  <img src="../assets/images/money-icn.png">
                </span>
              </div>
              <div class="pre-rwds__footer">Trophy, Medals & Certificates</div>
            </div>

            <div class="pre-rwds__image">
              <img src="../assets/images/trophy-img.png" alt="">
            </div>
          </div>

        </div>
      </div>
    </div>

  </section>
  <div class="" style="height: 400px; display: block; width: 100%;"></div>
  <!-- body content end -->

  <!-- scripts -->
  <script src="../assets/js/jquery.slim.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="../assets/js/slick.min.js"></script>
  <script src="../assets/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/script.js"></script>
  <!-- scripts -->
  <script>
			AOS.init({
				duration: 1000
			});
		</script>
</body>

</html>
